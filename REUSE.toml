version = 1

# JSON can not carry a comment header. A sample of the public config a domain
# publishes at /.well-known/sre.json for the setup wizard to discover.
[[annotations]]
path = "sre.json.example"
precedence = "override"
SPDX-FileCopyrightText = "The gumshoe Authors"
SPDX-License-Identifier = "0BSD"

# JSON can not carry a comment header. The Claude Code plugin manifests.
[[annotations]]
path = ".claude-plugin/*.json"
precedence = "override"
SPDX-FileCopyrightText = "The gumshoe Authors"
SPDX-License-Identifier = "0BSD"

# JSON can not carry a comment header. Golden JSON reports of detective tests.
[[annotations]]
path = ["tools/*/tests/gumshoe/*_golden.json", "tests/gumshoe/*_golden.json"]
precedence = "override"
SPDX-FileCopyrightText = "The gumshoe Authors"
SPDX-License-Identifier = "0BSD"

# Recorded command output can not carry a comment header without changing it.
# nginx -T and php -i dumps from public images, for the upload tool's tests.
[[annotations]]
path = "tools/upload/tests/fixtures/*.txt"
precedence = "override"
SPDX-FileCopyrightText = "The gumshoe Authors"
SPDX-License-Identifier = "0BSD"

# Recorded command output can not carry a comment header without changing it.
# psql --csv answers from a throwaway docker.io/library/postgres:18 container,
# for the connection reading's tests.
[[annotations]]
path = "tests/fixtures/postgres/*.csv"
precedence = "override"
SPDX-FileCopyrightText = "The gumshoe Authors"
SPDX-License-Identifier = "0BSD"

# Recorded command output can not carry a comment header without changing it.
# dig +noall +comments +answer runs against 1.1.1.1 and the unroutable
# 192.0.2.1, for the DNS reading's tests.
[[annotations]]
path = "tests/fixtures/dns/*.txt"
precedence = "override"
SPDX-FileCopyrightText = "The gumshoe Authors"
SPDX-License-Identifier = "0BSD"

# Command output in kubectl's format (api-resources rows and stderr, a
# namespace's lists as JSON) can not carry a comment header, for the
# unmanaged-objects detective's tests.
[[annotations]]
path = "tests/fixtures/unmanaged/*"
precedence = "override"
SPDX-FileCopyrightText = "The gumshoe Authors"
SPDX-License-Identifier = "0BSD"
