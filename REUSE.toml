version = 1

# JSON can not carry a comment header. A sample of the public config a domain
# publishes at /.well-known/sre.json for the setup wizard to discover.
[[annotations]]
path = "sre.json.example"
precedence = "override"
SPDX-FileCopyrightText = "The gumshoe Authors"
SPDX-License-Identifier = "0BSD"

# JSON can not carry a comment header. The Claude Code plugin manifests.
[[annotations]]
path = ".claude-plugin/*.json"
precedence = "override"
SPDX-FileCopyrightText = "The gumshoe Authors"
SPDX-License-Identifier = "0BSD"

# JSON can not carry a comment header. Golden JSON reports of detective tests.
[[annotations]]
path = ["tools/*/tests/gumshoe/*_golden.json", "tests/gumshoe/*_golden.json"]
precedence = "override"
SPDX-FileCopyrightText = "The gumshoe Authors"
SPDX-License-Identifier = "0BSD"

# Recorded command output can not carry a comment header without changing it.
# nginx -T and php -i dumps from public images, for the upload tool's tests.
[[annotations]]
path = "tools/upload/tests/fixtures/*.txt"
precedence = "override"
SPDX-FileCopyrightText = "The gumshoe Authors"
SPDX-License-Identifier = "0BSD"
