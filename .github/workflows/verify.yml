name: Verify
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: metio/ci/breto@df245b0c4dacc9bb14c804bb5d4305a405e26fb1 # 2026.11.1153404
        with:
          registries: github:metio/toolchains
      - name: Run the book test suite
        run: bb test
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: metio/ci/breto@df245b0c4dacc9bb14c804bb5d4305a405e26fb1 # 2026.11.1153404
        with:
          registries: github:metio/toolchains
      - env:
          GH_TOKEN: ${{ github.token }}
        run: breto run ci-lint
  verify:
    # Single required check covering every job above: mark only this required
    # in branch protection and new jobs are covered automatically.
    name: Verify
    needs: [test, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
