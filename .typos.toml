[default]
extend-ignore-re = []

[default.extend-words]
edn = "edn"
juxt = "juxt"
unparseable = "unparseable"
criticals = "criticals"

[default.extend-identifiers]

[files]
# Recorded command output stays byte for byte: a DNS token or an EDE
# (Extended DNS Error) line is no word to correct.
extend-exclude = ["LICENSES/", "tests/fixtures/dns/"]
